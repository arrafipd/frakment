# Lefthook config - https://github.com/evilmartians/lefthook
# Format runs BEFORE registry-build so JSON snapshots the post-format source.
# Reversing this order causes content drift (source changes after build).

pre-commit:
  parallel: false
  jobs:
    - name: format
      glob: "*.{ts,tsx,js,jsx,json,md,mdx,css,yml,yaml}"
      run: npx ultracite fix {staged_files}
      stage_fixed: true

    - name: registry-build
      glob:
        [
          "apps/web/registry/**",
          "apps/web/examples/**",
          "apps/web/frakment.json",
        ]
      run: node tooling/registry/web/build-registry.ts
      stage_fixed: true

    - name: lint
      glob: "*.{ts,tsx,js,jsx,json}"
      run: npx ultracite check {staged_files}

    - name: typecheck
      glob: "apps/web/**/*.{ts,tsx}"
      run: npm run typecheck

    - name: registry-audit
      glob:
        [
          "apps/web/registry/**",
          "apps/web/components/ui/**",
          "apps/web/frakment.json",
        ]
      run: node tooling/registry/web/audit-registry.ts

    - name: secrets
      run: node scripts/scan-secrets.ts

commit-msg:
  jobs:
    - name: conventional
      run: node scripts/check-commit-msg.ts {1}

pre-push:
  parallel: false
  jobs:
    - name: build
      run: npm run build
    - name: test
      run: npm run test
