# Lefthook config - https://github.com/evilmartians/lefthook
# Registry MUST build before format -> no JSON drift. See HANDOFF.md.

pre-commit:
  parallel: false
  jobs:
    - name: registry-build
      glob:
        [
          "apps/web/registry/**",
          "apps/web/examples/**",
          "apps/web/frakment.json",
        ]
      run: node apps/web/scripts/build-registry.mjs
      stage_fixed: true

    - name: format
      glob: "*.{ts,tsx,js,jsx,json,md,mdx,css,yml,yaml}"
      run: npx ultracite fix {staged_files}
      stage_fixed: true

    - name: lint
      glob: "*.{ts,tsx,js,jsx,json}"
      run: npx ultracite check {staged_files}

    - name: typecheck
      glob: "apps/web/**/*.{ts,tsx}"
      run: npm run typecheck

    - name: registry-audit
      glob:
        [
          "apps/web/registry/**",
          "apps/web/components/ui/**",
          "apps/web/frakment.json",
        ]
      run: node apps/web/scripts/audit-registry.mjs

    - name: secrets
      run: node scripts/scan-secrets.mjs

commit-msg:
  jobs:
    - name: conventional
      run: node scripts/check-commit-msg.mjs {1}

pre-push:
  parallel: false
  jobs:
    - name: build
      run: npm run build
    - name: test
      run: npm run test
