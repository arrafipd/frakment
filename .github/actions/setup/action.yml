name: Setup and install
description: Common setup steps for Actions

inputs:
  pm:
    description: Package manager to use (npm or pnpm)
    required: false
    default: npm

runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Upgrade npm (fix EMISSINGSIGNATUREKEY for keyless attestations)
      shell: bash
      run: npm install -g npm@11.11.0
    - name: Enable pnpm
      if: inputs.pm == 'pnpm'
      shell: bash
      run: |
        corepack enable
        corepack prepare pnpm@12 --activate
        pnpm --version
    - name: Install (npm)
      if: inputs.pm == 'npm'
      shell: bash
      run: npm ci
    - name: Install (pnpm)
      if: inputs.pm == 'pnpm'
      shell: bash
      run: pnpm install
