version: 2
updates:
  # Dependabot's "npm" ecosystem reads package.json and updates package-lock.json.
  # This covers both npm and pnpm users (pnpm-lock.yaml is gitignored; pnpm resolves from package.json).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]