name: OSV-Scanner
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
  actions: read
  security-events: write
jobs:
  osv:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v1.8.1
    with:
      scan-args: |-
        --lockfile=package-lock.json
        --format=sarif
        --output=osv.sarif
    permissions:
      contents: read
      actions: read
      security-events: write