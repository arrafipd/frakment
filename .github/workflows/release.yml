name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  release:
    uses: frakment/.github/.github/workflows/ui-release-reusable.yml@596725c531f4cdde69a45c708e941d888af6e7d4
    permissions:
      contents: write
      pull-requests: write
      id-token: write
