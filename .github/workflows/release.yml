name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  release:
    uses: frakment/.github/.github/workflows/ui-release-reusable.yml@5d397f93bb61629dacb32936d0d23f31a792a40a
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
