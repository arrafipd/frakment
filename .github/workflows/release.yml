name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  release:
    uses: frakment/.github/.github/workflows/ui-release-reusable.yml@91e5c204666274d1c5238636d26543637f926aba
    permissions:
      contents: write
      pull-requests: write
      id-token: write
