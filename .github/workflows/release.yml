name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.11.0
      - run: npm ci
      # changesets auto-detects pnpm from pnpm-workspace.yaml and spawns
      # `pnpm publish` for each package. pnpm must be on PATH even though
      # CI and build steps run on npm. The actual upload goes through
      # libnpmpublish (same as npm publish), so the tarball, integrity,
      # and provenance are identical.
      - name: Enable pnpm (changesets spawns pnpm publish)
        run: |
          corepack enable
          corepack prepare pnpm@12 --activate
          pnpm --version
      - name: Create Release PR or Publish
        uses: changesets/action@v1.7.0
        with:
          publish: npm run release
          version: npm run version:packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
      - name: Ensure version tags exist for published packages
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Waiting 30s for npm registry propagation..."
          sleep 30
          for pkg in packages/*/package.json; do
            name=$(node -p "require('./$pkg').name")
            version=$(node -p "require('./$pkg').version")
            tag="${name}@${version}"
            on_npm=false
            for attempt in 1 2 3 4; do
              if npm view "$name@$version" version >/dev/null 2>&1; then
                on_npm=true
                break
              fi
              if [ "$attempt" -lt 4 ]; then
                echo "Attempt $attempt: $tag not on npm yet, retry in 10s..."
                sleep 10
              fi
            done
            if [ "$on_npm" = false ]; then
              echo "Skip $tag (not on npm after retries)"
              continue
            fi
            if ! git rev-parse "$tag" >/dev/null 2>&1; then
              git tag -a "$tag" -m "$tag"
              git push origin "$tag" || true
            fi
            if ! gh release view "$tag" >/dev/null 2>&1; then
              latest_flag="--latest=false"
              if [ "$name" = "frakment" ]; then latest_flag="--latest"; fi
              gh release create "$tag" --title "$tag" --notes "Release $tag" --verify-tag $latest_flag || true
            fi
          done
