name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  release:
    uses: frakment/.github/.github/workflows/ui-release-reusable.yml@cafe51a38816def7ba40125957b7c3c38a6ec9db
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    secrets:
      github_token: ${{ secrets.GITHUB_TOKEN }}
