name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  release:
    uses: frakment/.github/.github/workflows/ui-release-reusable.yml@cbb09b840c5385af666438de74afe9a2963fc7ff
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
