name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  release:
    uses: frakment/.github/.github/workflows/ui-release-reusable.yml@434c77d270241a9c4f2cf61415f1660894e1735f
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
