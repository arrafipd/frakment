name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    uses: frakment/.github/.github/workflows/codeql-reusable.yml@5d397f93bb61629dacb32936d0d23f31a792a40a
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
