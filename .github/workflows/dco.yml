name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - name: Skip DCO for Dependabot
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: echo "DCO check skipped for Dependabot PR"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: get-pr-commits
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: tim-actions/get-pr-commits@198af03565609bb4ed924d1260247b4881f09e7d
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Signed-off-by on all commits
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: tim-actions/dco@f2279e6e62d5a7d9115b0cb8e837b777b1b02e21
        with:
          commits: ${{ steps.get-pr-commits.outputs.commits }}
