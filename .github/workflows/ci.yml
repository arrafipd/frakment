name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, pnpm]
    name: lint-and-format (${{ matrix.pm }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          pm: ${{ matrix.pm }}

      - name: Lint and format
        run: ${{ matrix.pm }} run check

  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, pnpm]
    name: typecheck (${{ matrix.pm }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          pm: ${{ matrix.pm }}

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: ${{ matrix.pm }} run build

      - name: Typecheck
        run: ${{ matrix.pm }} run typecheck

  registry-drift:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, pnpm]
    name: registry-drift (${{ matrix.pm }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          pm: ${{ matrix.pm }}

      - name: Build registry
        run: ${{ matrix.pm }} run registry:build

      - name: Check for drift
        run: |
          if [ -n "$(git status --porcelain public/r public/skills)" ]; then
            echo "::error::Registry artifacts are stale."
            echo "::error::Run '${{ matrix.pm }} run registry:build' locally and commit the result."
            echo ""
            echo "Changed files:"
            git status --porcelain public/r public/skills
            echo ""
            echo "Diff:"
            git diff public/r public/skills
            exit 1
          fi
          echo "Registry artifacts are in sync with source."

      - name: Registry audit
        run: ${{ matrix.pm }} run registry:audit

  theme-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check styles/theme.css in sync with CLI template
        run: |
          if ! diff -q styles/theme.css packages/cli/templates/theme.css; then
            echo "::error::styles/theme.css and packages/cli/templates/theme.css have drifted."
            echo "::error::Run: cp styles/theme.css packages/cli/templates/theme.css"
            echo ""
            echo "Diff:"
            diff -u styles/theme.css packages/cli/templates/theme.css || true
            exit 1
          fi
          echo "theme.css is in sync with CLI template."

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, pnpm]
    name: test (${{ matrix.pm }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          pm: ${{ matrix.pm }}

      - name: Test
        run: ${{ matrix.pm }} test

      - name: Audit package signatures
        if: matrix.pm == 'npm'
        run: npm audit signatures

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
